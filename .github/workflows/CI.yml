name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  # Direct pushes to main/master must run the test suite (HSquared.jl #367).
  # This repo often lands commits straight on main; without `push`, only
  # Documenter fires and a green docs badge is easy to misread as "CI passed".
  # Full 4-leg matrix on push is intentional (~7 min): DoD wants per-commit
  # evidence. Cost is runner latency on a public repo, not dollars. Do not
  # "trim" the push matrix to save minutes without a measured table.
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      run_plotting:
        description: 'Also run the live-draw plotting check (installs CairoMakie + AlgebraOfGraphics)'
        type: boolean
        default: false

# Never cancel a run on main/master: a superseded main run reports no status
# at all ("green by absence"). Only a later push to the same PR ref makes an
# in-flight run genuinely redundant. Pattern from GLLVM.jl / ci-diagnose §5.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Keep the shared runners' thread usage predictable; the wall-time and
    # allocation assertions remain unchanged. Default-thread and multi-BLAS
    # configurations are not covered by this matrix.
    env:
      OPENBLAS_NUM_THREADS: 1
      JULIA_NUM_THREADS: 2
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1']
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6

      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}

      - uses: julia-actions/cache@v2

      - uses: julia-actions/julia-buildpkg@v1

      - uses: julia-actions/julia-runtest@v1

      # Coverage is processed on ONE matrix cell only: Ubuntu + current-stable
      # Julia `1`. The four-leg matrix still runs the full suite on every
      # OS/version (existing shards). Each cell runs the same tests, so
      # uploading 1.10 and Windows as well would count the same src/ lines
      # four times. julia-runtest's default remains coverage=true on every
      # cell; only this cell turns .cov files into lcov and keeps them.
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.os == 'ubuntu-latest' && matrix.version == '1'

      - name: Record coverage SHAs
        if: matrix.os == 'ubuntu-latest' && matrix.version == '1'
        run: |
          set -euo pipefail
          echo "event_name=${GITHUB_EVENT_NAME}"
          echo "github.sha (event SHA; pull_request is often the synthetic merge) = ${GITHUB_SHA}"
          echo "checked_out HEAD = $(git rev-parse HEAD)"
          echo "pr.head.sha (branch head, empty when not a PR) = ${{ github.event.pull_request.head.sha }}"
          echo "pr.base.sha = ${{ github.event.pull_request.base.sha }}"

      - name: Summarise Ubuntu Julia 1 lcov
        if: matrix.os == 'ubuntu-latest' && matrix.version == '1'
        run: |
          set -euo pipefail
          test -f lcov.info
          awk '
            /^DA:/ {
              split($0, a, /[:,]/)
              total++
              if (a[3] + 0 > 0) hit++
            }
            END {
              if (total == 0) { print "lcov.info has no DA: lines"; exit 1 }
              printf "ubuntu Julia 1: %d/%d lines hit = %.2f%%\n",
                     hit, total, 100.0 * hit / total
            }
          ' lcov.info

      - name: Upload Ubuntu Julia 1 lcov artefact
        if: matrix.os == 'ubuntu-latest' && matrix.version == '1'
        uses: actions/upload-artifact@v6
        with:
          name: coverage-lcov-julia1-ubuntu
          path: lcov.info
          if-no-files-found: error
          retention-days: 1

  # Codecov upload is a separate, NON-required job. Do not add `codecov` to
  # branch protection: an OIDC/auth miss must not become a merge blocker.
  # One upload of the Ubuntu Julia 1 lcov file. Julia 1.10 and Windows cells
  # do not upload (same suite, would double-count).
  #
  # PR vs default-branch: this job also runs on pull_request, so a PR can
  # produce a commit report. A functional Codecov *compare-to-main* / project
  # baseline still needs an accepted upload on `main` after an owner merge.
  # This workflow does not merge, force-push, or rewrite history.
  codecov:
    name: codecov
    needs: test
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Record upload SHAs
        run: |
          set -euo pipefail
          echo "event_name=${GITHUB_EVENT_NAME}"
          echo "github.sha (event SHA; pull_request is often the synthetic merge) = ${GITHUB_SHA}"
          echo "checked_out HEAD = $(git rev-parse HEAD)"
          echo "pr.head.sha (branch head, empty when not a PR) = ${{ github.event.pull_request.head.sha }}"
          echo "pr.base.sha = ${{ github.event.pull_request.base.sha }}"

      - name: Download Ubuntu Julia 1 lcov artefact
        uses: actions/download-artifact@v6
        with:
          name: coverage-lcov-julia1-ubuntu
          path: coverage

      - name: Combined lcov line counts
        run: |
          set -euo pipefail
          test -f coverage/lcov.info || {
            echo "::error::coverage/lcov.info missing (Ubuntu Julia 1 tests may have failed)"
            ls -la coverage || true
            exit 1
          }
          awk '
            /^DA:/ {
              split($0, a, /[:,]/)
              total++
              if (a[3] + 0 > 0) hit++
            }
            END {
              if (total == 0) { print "lcov.info has no DA: lines"; exit 1 }
              printf "upload file ubuntu Julia 1: %d/%d lines hit = %.2f%%\n",
                     hit, total, 100.0 * hit / total
            }
          ' coverage/lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage/lcov.info
          disable_search: true
          flags: julia-linux-1
          name: julia-linux-1
          use_oidc: true
          fail_ci_if_error: true
          verbose: true

  # OPT-IN, OFF BY DEFAULT. `inputs` is empty on `pull_request`, so this job is skipped
  # unless a human dispatches the workflow with `run_plotting = true`.
  #
  # WHY IT EXISTS. The default suite asserts `isempty(methods(hsquared_figure))` with
  # Makie/AoG absent -- it PASSES PRECISELY WHEN THE EXTENSION FAILS TO LOAD, so it is
  # zero evidence about the drawing layer. This job is the only CI that exercises it.
  # It stays opt-in because Makie + AoG dominate the install/precompile budget, and the
  # drawing layer changes rarely. Run it on any Makie / AlgebraOfGraphics / CairoMakie
  # bump, and on any PR touching `ext/HSquaredMakieExt.jl`.
  #
  # The driver's object assertions cannot see everything: of the five defect classes found on
  # 2026-07-08, two were caught only by looking at the rendered PNG -- and one of those two had
  # PASSED an object assertion that counted the annotation without checking where it sat. That
  # is why this job UPLOADS THE FIGURES: a green check here still means "download the artifact
  # and look". The driver rasterizes BEFORE it asserts, so the PNGs exist on a red run too.
  plotting:
    name: Live-draw plotting check (opt-in)
    if: ${{ inputs.run_plotting }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.10'

      - uses: julia-actions/cache@v2

      - name: Live draw (9/9 kinds, forest + caterpillar invariants)
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/aog-livedraw"
          cd "${RUNNER_TEMP}/aog-livedraw"
          julia --project=. -e 'import Pkg
            Pkg.develop(path = ENV["GITHUB_WORKSPACE"])
            Pkg.add(["CairoMakie", "AlgebraOfGraphics"])'
          julia --project=. "${GITHUB_WORKSPACE}/docs/dev-log/scripts/2026-07-08-plotting-aog-livedraw.jl"

      - name: Upload rendered figures (LOOK AT THEM -- assertions are not visual verification)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: live-draw-figures
          path: ${{ runner.temp }}/aog-livedraw/*.png
          if-no-files-found: error
