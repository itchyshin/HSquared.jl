name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exploratory-paired-timing:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13.3'
      - name: Stage and verify reviewed diagnostic
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'tools/pr496_ci_diagnostic'
          $dest = Join-Path $env:RUNNER_TEMP 'pr496-diag'
          New-Item -ItemType Directory -Path $dest | Out-Null
          $expected = @{
            'paired.jl' = '6b56a63fe0e99c8b8813f359decd5a14c5943ccf52af948d1e70aa05c44ff2c4'
            'provision.ps1' = '893b6dc8d569802436fbb2cecc24e4d5b56494078b4b47b6a77e7141b40eeab5'
            'run.ps1' = 'f22cca6164ad4a4976a0199b50f178e3124088ec95e7739c589e64586e3078a0'
            'pinned-Manifest-1.13.3.toml' = '272ce679b561dedde1d733b783905cc6201cd9ed08b99acc1f87082e5454597b'
          }
          foreach ($file in $expected.Keys) {
            $inputFile = Join-Path $source $file
            if ((Get-FileHash -Algorithm SHA256 $inputFile).Hash.ToLowerInvariant() -ne $expected[$file]) { throw "Staging hash mismatch: $file" }
            Copy-Item $inputFile (Join-Path $dest $file)
          }
      - name: Provision pinned sources and dependencies
        shell: pwsh
        timeout-minutes: 15
        run: '& "$env:RUNNER_TEMP/pr496-diag/provision.ps1" -DiagDir "$env:RUNNER_TEMP/pr496-diag"'
      - name: Run exploratory paired check
        shell: pwsh
        timeout-minutes: 12
        run: '& "$env:RUNNER_TEMP/pr496-diag/run.ps1" -DiagDir "$env:RUNNER_TEMP/pr496-diag"'
      - name: Retain results even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr496-paired-evidence
          path: ${{ runner.temp }}/pr496-paired-evidence
          if-no-files-found: warn
