# Codecov config for HSquared.jl.
#
# Uploads come from CI.yml's non-required `codecov` job: one Ubuntu /
# Julia 1.10 (compat LTS) lcov file, flag `julia-linux-1.10`. That is
# version-specific coverage from the supported julia-runtest +
# julia-processcoverage producer, not a Julia-1 timing-bar fix. The other
# three matrix cells (Julia 1.10 Windows, Julia 1 Ubuntu/Windows) still run
# the full suite as visible checks but do not upload, so the same src/ lines
# are not counted four times.
#
# Status checks are informational so they cannot become accidental merge
# blockers. Do not treat this file as proof that Codecov accepted an upload.
# A compare-to-main report needs an accepted default-branch upload after an
# owner merge; this file does not authorise that merge.

coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "condensed_header, condensed_files, condensed_footer"
  behavior: default
  require_changes: true

ignore:
  - "test/**"
  - "docs/**"
  - "bench/**"
  - "tools/**"
  - "sim/**"
  - "comparator/**"

flag_management:
  default_rules:
    carryforward: true
  individual_flags:
    - name: julia-linux-1.10
      carryforward: true
