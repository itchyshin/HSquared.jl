schema_version = 1
updated = "2026-09-01"
lane = "HSquared.jl"
r_index_mirror = "hsquared/docs/design/real-data-validation-manifest.toml"
claim_boundary = "Three-tier validation ladder index with explicit claim boundaries per arc. Does not promote any capability to covered, does not claim field-empirical validation, and does not add external comparator evidence."

[tier_summary]
tier_1 = "Unit fixtures: CI-fast algebra, twin parity, simulated recovery, test-of-test negatives. Not empirical validation."
tier_2 = "Published anchors: Mrode supplied-variance BLUP canon and gryphon teaching-data REML band. Not field empirical data."
tier_3 = "Opt-in large comparator legs on generated fixtures and documented protocols. Not broad multi-package parity at scale."
tier_4 = "Field empirical data: NOT STARTED. Placeholder only — do not conflate with gryphon, Mrode supplied-variance examples, or comparator CSV packets."

[darwin_review]
status = "pending"
signed_date = ""
reviewer = ""
notes = "Biology sign-off required before any Tier 2 arc may support a covered flip or user-facing real-data language."

[[darwin_review.questions]]
id = "gryphon_headline_quantity"
text = "Is birth-weight h² the right headline quantity for the gryphon anchor?"
arc_ids = ["gryphon_bwt_reml"]

[[darwin_review.questions]]
id = "gryphon_citation"
text = "Is Wilson et al. 2010 the canonical citation for the pinned digits (σ²ₐ=3.3954, σ²ₑ=3.8286, h²=0.470)?"
arc_ids = ["gryphon_bwt_reml"]

[[darwin_review.questions]]
id = "gryphon_supplied_a"
text = "Does supplied-A (vs pedigree-built A) remain acceptable for a published REML recovery label in user-facing docs?"
arc_ids = ["gryphon_bwt_reml"]

[[darwin_review.questions]]
id = "mv_correlation_estimand"
text = "For multivariate arcs, is the correlation/covariance the biologically meaningful recovered quantity?"
arc_ids = ["mrode_ex_5_1_multitrait_blup", "sommer_multitrait_phase4"]

[[darwin_review.checklist]]
item = "Tier 2 quantity choices signed for gryphon and Mrode BLUP anchors"
status = "pending"

[[darwin_review.checklist]]
item = "Teaching-simulated gryphon data never labelled field empirical"
status = "pending"

[[darwin_review.checklist]]
item = "Tier 4 field dataset deferred or owner-supplied with license boundary"
status = "pending"

