[manifest]
id = "HSQ09-S9"
schema_version = 1
source_inert = true

[repositories.julia]
base_commit = "1dbf8b97a3b28f814e3418239ac1658acbbc19bb"
allowed_dirty_paths = [
  "docs/dev-log/evidence/2026-09-07-hsq09-s9-evidence-manifest.toml",
  "tools/validate_hsq09_s9_manifest.jl",
  "test/test_hsq09_s9_manifest.jl",
]

[repositories.r]
commit = "e6a1ce4e8a691795487420668b349fb9e2670059"
root_env = "HSQ09_S9_R_ROOT"

[contract]
master_seed = 20260903
seed_stride = 40009
screen_reps_per_cell = 48
confirm_interpretable_reps_target = 2000
confirm_target_status = "retained_intended_target_not_run"
nominal_level = 0.95
coverage_denominator = "interval_success"
claim_eligible = false
gate = "PATH_ONLY"
recorded_counters = [
  "reps",
  "fit_success",
  "fit_converged",
  "interval_success",
  "covered",
  "failure_reason",
]

[conditional_coverage]
denominator_symbol = "I"
denominator = "interval_success"
not_convergence = true
interpretable_if = "I >= 0.9 * reps"
pooling = "sum(covered) / sum(I)"
observed_coverage = "C / I"
observed_mcse = "sqrt((C / I) * (1 - C / I) / I)"
nominal_mcse = "sqrt(0.95 * 0.05 / I)"
nominal_mcse_status = "descriptive_only"
nominal_band = "0.95 +/- 2 * observed_MCSE"
nominal_band_status = "heuristic_not_calibration_proof"
level_090_status = "descriptive_only"

[authorizations]
compute = false
smoke = false
screen = false
confirm = false
campaign = false
promotion = false
release = false
public_count = false
version = false
h0_ratification = false
h1_h3_coverage_claim = false
outcomes_import = false

[results]
results_imported = false
result_values_present = false
outcomes_imported = false

[sbatch_template]
armed = false
effective_exit_code = 78
execution = "refusal_only"

[exclusions]
