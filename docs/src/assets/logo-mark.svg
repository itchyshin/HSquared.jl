<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100" role="img" aria-labelledby="title desc">
  <title id="title">HSquared.jl navbar mark (PROPOSAL)</title>
  <desc id="desc">PROPOSAL draft, not a settled brand decision. The same hex as assets/logo.svg, redrawn for 24-26px chrome: heavier pale rim, the pedigree collapsed to a single gold bar, and a filled h-squared sized to stay legible. Package is EXPERIMENTAL (D-41).</desc>

  <!-- Chrome size, so no gradient (invisible at 26px) and no second edge. -->
  <path d="M50 3 94 26.5v47L50 97 6 73.5v-47Z" fill="#072A36"/>
  <path d="M50 3 94 26.5v47L50 97 6 73.5v-47Z" fill="none" stroke="#D6E8E8" stroke-width="6" stroke-linejoin="round"/>

  <!-- Florence found the three-ring pedigree closing to a gold bar at 24px.
       Lean into it: one bar is the mark, three rings are the diagram. -->
  <path d="M28 31 H72" fill="none" stroke="#F0B429" stroke-width="6.5" stroke-linecap="round"/>

  <text x="42" y="86" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="50" fill="#F8FBFB">h</text>
  <text x="72" y="61" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="26" fill="#F8FBFB">2</text>
</svg>
