<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">HSquared.jl hex mark (PROPOSAL)</title>
  <desc id="desc">PROPOSAL draft, not a settled brand decision. Dark teal twin of the R mark: same h-squared, pedigree as hollow gold rings. No wordmark; not a bright tile. Package is EXPERIMENTAL (D-41).</desc>
  <defs>
    <linearGradient id="hsqjlFill" x1="220" y1="140" x2="980" y2="1060" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A3A48"/>
      <stop offset="0.55" stop-color="#072A36"/>
      <stop offset="1" stop-color="#041C24"/>
    </linearGradient>
    <clipPath id="hsqjlClip">
      <path d="M600 44 1058 322v556L600 1156 142 878V322Z"/>
    </clipPath>
  </defs>

  <path d="M600 44 1058 322v556L600 1156 142 878V322Z" fill="url(#hsqjlFill)"/>
  <path d="M600 44 1058 322v556L600 1156 142 878V322Z" fill="none" stroke="#D6E8E8" stroke-width="22" stroke-linejoin="round"/>
  <path d="M600 82 1028 342v516L600 1118 172 858V342Z" fill="none" stroke="#F0B429" stroke-width="5" stroke-linejoin="round" opacity="0.85"/>

  <g clip-path="url(#hsqjlClip)">
    <g fill="none" stroke="#F0B429" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
      <path d="M400 268 H800"/>
      <path d="M600 268 V392"/>
      <path d="M400 392 H800"/>
      <path d="M400 392 V458"/>
      <path d="M800 392 V458"/>
    </g>
    <circle cx="400" cy="268" r="46" fill="none" stroke="#F0B429" stroke-width="14"/>
    <circle cx="800" cy="268" r="46" fill="none" stroke="#F0B429" stroke-width="14"/>
    <circle cx="400" cy="458" r="46" fill="none" stroke="#F0B429" stroke-width="14"/>
    <circle cx="800" cy="458" r="46" fill="none" stroke="#F0B429" stroke-width="14"/>

    <!-- Filled h² (outline type vanishes at 24 px). Twin difference is hollow gold nodes. -->
    <text x="600" y="860" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="400" fill="#F8FBFB">h</text>
    <text x="812" y="568" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="188" fill="#F8FBFB">2</text>
  </g>
</svg>
