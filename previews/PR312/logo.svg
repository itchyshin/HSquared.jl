<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">HSquared.jl hex mark (PROPOSAL)</title>
  <desc id="desc">PROPOSAL draft, not a settled brand decision. The Julia twin of the R hsquared mark: same pointy-top hex, same four-node full-sib pedigree and h-squared, on a deeper and colder field. The four nodes carry hues from the Julia language palette, retuned to a common lightness so no individual outranks another; the colours are a language cue only and encode no sex, genotype, founder status or phenotype. Not affiliated with, and not endorsed by, JuliaLang. Package is EXPERIMENTAL (D-41).</desc>
  <defs>
    <linearGradient id="hsqjlFill" x1="220" y1="140" x2="980" y2="1060" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#072A36"/>
      <stop offset="0.55" stop-color="#041C24"/>
      <stop offset="1" stop-color="#02141B"/>
    </linearGradient>
    <radialGradient id="hsqjlGlow" cx="50%" cy="40%" r="62%">
      <stop offset="0" stop-color="#0A6C7E" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#02141B" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="hsqjlClip">
      <path d="M600 44 1058 322v556L600 1156 142 878V322Z"/>
    </clipPath>
  </defs>

  <path d="M600 44 1058 322v556L600 1156 142 878V322Z" fill="url(#hsqjlFill)"/>
  <path d="M600 44 1058 322v556L600 1156 142 878V322Z" fill="url(#hsqjlGlow)"/>
  <path d="M600 44 1058 322v556L600 1156 142 878V322Z" fill="none" stroke="#D6E8E8" stroke-width="22" stroke-linejoin="round"/>

  <g clip-path="url(#hsqjlClip)">
    <!-- Same full-sib unit as the R mark (two parents, mating bar, drop,
         sibship bar, two offspring) so the twins share one motif. Connectors
         are pale, not gold: with four hues on the nodes a fifth colour on the
         lines would make the mark a palette rather than a pedigree. -->
    <g fill="none" stroke="#D6E8E8" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" opacity="0.72">
      <path d="M350 350 H850"/>
      <path d="M600 350 V544"/>
      <path d="M350 544 H850"/>
    </g>

    <!-- Julia's four hues, retuned to 6.2-7.1:1 on the field (raw values run
         3.3-4.8:1, a spread wide enough that one node shouts and another
         vanishes, which the eye reads as rank). Filled, not hollow: hollow
         rings close to a smear below ~32px. -->
    <circle cx="350" cy="350" r="66" fill="#F0736A" stroke="#EAF4F5" stroke-width="10"/>
    <circle cx="850" cy="350" r="66" fill="#C293DD" stroke="#EAF4F5" stroke-width="10"/>
    <circle cx="350" cy="544" r="66" fill="#57B546" stroke="#EAF4F5" stroke-width="10"/>
    <circle cx="850" cy="544" r="66" fill="#83A3F3" stroke="#EAF4F5" stroke-width="10"/>

    <!-- Filled h-squared: outline type vanishes at 24px. Real superscript,
         not the "2" character, so the glyph reads as h-squared not "h2".
         Sized to the same fraction of the hex as the R twin (font 312 on a
         960-unit hex there, 361 on this 1112-unit one), so the two marks read
         as one family rather than as two different balances. -->
    <text x="586" y="924" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="800" font-size="361" fill="#F8FBFB" letter-spacing="-7">h<tspan font-size="199" dy="-164">2</tspan></text>
  </g>
</svg>
